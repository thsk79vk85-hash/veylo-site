<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>Leave the launch list · Veylo</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #173f37; background: #f8f7ef; }
    body { margin: 0; padding: 24px; }
    main { max-width: 480px; margin: 12vh auto; }
    h1 { font-size: 2rem; line-height: 1.2; }
    p { line-height: 1.65; overflow-wrap: anywhere; }
    button { font: inherit; font-weight: 600; min-height: 48px; padding: 12px 24px; border: 2px solid #173f37; border-radius: 12px; color: #fff; background: #173f37; cursor: pointer; }
    button:disabled { opacity: .6; cursor: default; }
    button:focus-visible, a:focus-visible { outline: 3px solid #b16b24; outline-offset: 4px; }
    a { color: inherit; }
    #unsubscribe-status { min-height: 5em; }
  </style>
  <script src="/launch-unsubscribe.js" defer></script>
</head>
<body>
  <main>
    <p>veylo.</p>
    <h1>Leave the launch list</h1>
    <p>This removes launch-list emails only. It does not change your beta registration or your Veylo account.</p>
    <p id="unsubscribe-status" role="status" aria-live="polite">Open the link from your launch email to continue.</p>
    <button id="unsubscribe-button" type="button" disabled>Remove me</button>
    <noscript><p>JavaScript is needed to confirm removal here. You can also contact support below.</p></noscript>
    <p>Need help? <a href="mailto:support@joinveylo.com">support@joinveylo.com</a></p>
  </main>
</body>
</html>
